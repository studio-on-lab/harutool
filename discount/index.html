<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>할인율 계산기 | 할인 가격·절약 금액 계산 - 하루툴</title><meta name="description" content="원래 가격과 할인율을 입력하면 할인 금액과 최종 결제 가격을 바로 계산합니다."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/discount/"><style>body{font-family:system-ui,sans-serif;background:#f6f7f9;margin:0;color:#17191d}.w{max-width:720px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;margin:20px 0}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;font:inherit;margin-top:10px}input{border:1px solid #ddd}button{border:0;background:#111827;color:#fff;font-weight:800}.result{padding:22px;background:#f0fdf4;border-radius:14px;margin-top:14px;text-align:center;font-size:22px;font-weight:800}a{color:#334155}p{line-height:1.7;color:#64748b}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>🏷️ 할인율 계산기</h1><p>가격과 할인율을 입력하면 얼마나 아끼는지와 실제 결제 금액을 계산합니다.</p><section class="card"><label>원래 가격(원)</label><input id="price" type="number" value="100000"><label>할인율(%)</label><input id="rate" type="number" value="20"><button onclick="go()">할인 가격 계산</button><div id="r" class="result">계산 결과</div></section><section class="card"><h2>계산 방법</h2><p>할인 금액은 원래 가격 × 할인율이며, 최종 가격은 원래 가격에서 할인 금액을 뺀 값입니다.</p><p><a href="../percentage/">퍼센트 계산기</a> · <a href="../change-rate/">증감률 계산기</a> · <a href="../vat/">부가세 계산기</a></p></section></main><script>function go(){const p=+price.value,q=+rate.value;if(p<0||q<0){r.textContent='값을 확인하세요';return}const d=p*q/100;r.innerHTML='할인 금액 '+Math.round(d).toLocaleString()+'원<br>최종 가격 '+Math.round(p-d).toLocaleString()+'원'}</script></body></html>
