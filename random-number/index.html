<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>랜덤 숫자 뽑기 | 중복 없는 번호 추첨 - 하루툴</title><meta name="description" content="원하는 최소값과 최대값 사이에서 중복 없이 랜덤 숫자를 무료로 뽑으세요. 번호 추첨, 순서 정하기에 사용할 수 있습니다."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/random-number/"><style>body{font-family:system-ui,'Noto Sans KR',sans-serif;background:#f6f7f9;margin:0;color:#17191d}.w{max-width:720px;margin:auto;padding:24px}.card{background:white;border:1px solid #e5e7eb;border-radius:20px;padding:22px;margin:20px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ddd;border-radius:12px;font:inherit}button{width:100%;padding:14px;border:0;border-radius:12px;background:#111827;color:white;font-weight:800;margin-top:12px}.result{font-size:28px;font-weight:900;padding:20px;text-align:center;background:#f8fafc;border-radius:14px;margin-top:12px}a{color:#334155}p{line-height:1.7;color:#64748b}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>🎲 랜덤 숫자 뽑기</h1><p>지정한 숫자 범위에서 원하는 개수만큼 중복 없이 무작위 번호를 뽑습니다.</p><div class="card"><div class="row"><input id="min" type="number" value="1" aria-label="최소값"><input id="max" type="number" value="45" aria-label="최대값"></div><input id="cnt" type="number" value="6" min="1" aria-label="뽑을 개수" style="margin-top:10px"><button onclick="go()">숫자 뽑기</button><div class="result" id="r">-</div></div><div class="card"><h2>중복 없는 랜덤 추첨</h2><p>모든 계산은 브라우저에서 처리됩니다. 행사 번호, 게임 순서, 간단한 추첨 등에 활용할 수 있습니다.</p></div></main><script>function go(){let a=+min.value,b=+max.value,n=+cnt.value;if(a>b)[a,b]=[b,a];let pool=[];for(let i=a;i<=b;i++)pool.push(i);if(n<1||n>pool.length){r.textContent='개수를 확인하세요';return}for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}r.textContent=pool.slice(0,n).sort((x,y)=>x-y).join(', ')}</script></body></html>
