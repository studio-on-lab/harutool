<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>부가세 계산기 | 공급가액·VAT 10% 계산 - 하루툴</title><meta name="description" content="VAT 포함 금액에서 공급가액과 부가세 10%를 빠르게 계산하는 무료 부가세 계산기입니다."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/vat/"><style>body{font-family:system-ui,'Noto Sans KR',sans-serif;background:#f6f7f9;margin:0;color:#17191d}.w{max-width:720px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;margin:20px 0}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;font:inherit}input{border:1px solid #ddd}button{border:0;background:#111827;color:#fff;font-weight:800;margin-top:10px}.result{font-size:20px;font-weight:800;padding:22px;background:#f8fafc;border-radius:14px;margin-top:12px;line-height:1.7}a{color:#334155}p{line-height:1.7;color:#64748b}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>🧾 부가세 계산기</h1><p>VAT 포함 합계금액을 입력하면 공급가액과 부가세를 나눠 보여줍니다.</p><div class="card"><input id="t" type="number" placeholder="예: 110000"><button onclick="go()">계산하기</button><div id="r" class="result">공급가액과 부가세가 표시됩니다.</div></div><div class="card"><h2>계산 기준</h2><p>일반적인 부가가치세율 10% 기준으로 단순 계산합니다. 실제 세무 처리는 거래 유형에 따라 달라질 수 있습니다.</p></div></main><script>function go(){const v=+t.value;if(!Number.isFinite(v)||v<0){r.textContent='금액을 확인하세요';return}const supply=Math.round(v/1.1),tax=v-supply;r.innerHTML='공급가액: '+supply.toLocaleString()+'원<br>부가세: '+tax.toLocaleString()+'원'}</script></body></html>
