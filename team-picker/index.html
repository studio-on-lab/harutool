<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>랜덤 팀 나누기 | 조 편성·팀 배정 - 하루툴</title><meta name="description" content="이름 목록을 입력하면 무작위로 팀을 나눠주는 무료 랜덤 팀 나누기 도구입니다."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/team-picker/"><style>*{box-sizing:border-box}body{font-family:system-ui,'Noto Sans KR',sans-serif;background:linear-gradient(160deg,#f8f7ff,#f6f7f9);margin:0;color:#17191d}.w{max-width:720px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:22px;margin:20px 0;box-shadow:0 10px 30px #1111}textarea,input,button{width:100%;padding:14px;border-radius:12px;font:inherit}textarea,input{border:1px solid #ddd}button{border:0;background:#111827;color:#fff;font-weight:900;font-size:17px;margin-top:10px}.slot{min-height:110px;margin-top:14px;border-radius:18px;background:#f3f0ff;display:grid;place-items:center;text-align:center;padding:20px;font-size:27px;font-weight:900}.rolling{animation:shake .1s infinite alternate}@keyframes shake{to{transform:translateY(2px);filter:blur(1px)}}.teams{display:grid;gap:10px;margin-top:14px}.team{background:#f8fafc;border-radius:15px;padding:15px;animation:pop .35s ease}@keyframes pop{50%{transform:scale(1.03)}}a{color:#334155}p{line-height:1.7;color:#64748b}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>👥 랜덤 팀 나누기</h1><p>이름들이 빠르게 섞이다가 마지막에 팀이 하나씩 공개됩니다.</p><div class="card"><textarea id="n" rows="6" placeholder="민수, 지영, 철수, 수빈"></textarea><input id="c" type="number" min="2" value="2" style="margin-top:10px"><button id="btn" onclick="go()">🔥 팀 배정 시작</button><div id="slot" class="slot">누가 누구와 한 팀일까?</div><div id="r" class="teams"></div></div><div class="card"><h2>다른 랜덤 도구</h2><p><a href="../roulette/">룰렛</a> · <a href="../random-number/">랜덤 숫자</a> · <a href="../lunch-menu/">점심메뉴 추천</a></p></div></main><script>let busy=false;function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function go(){if(busy)return;const people=n.value.split(/[,\n]/).map(x=>x.trim()).filter(Boolean),k=+c.value;if(people.length<2||k<2||k>people.length){slot.textContent='이름과 팀 수를 확인하세요';return}busy=true;btn.disabled=true;r.innerHTML='';slot.className='slot rolling';let i=0,delay=65;function roll(){slot.textContent=shuffle(people).slice(0,Math.min(4,people.length)).join('  •  ');i++;if(i>14)delay+=32;else delay+=6;if(i<22)setTimeout(roll,delay);else{const mixed=shuffle(people),teams=Array.from({length:k},()=>[]);mixed.forEach((x,idx)=>teams[idx%k].push(x));slot.className='slot';slot.textContent='팀 편성 완료!';let z=0;function reveal(){if(z<teams.length){const d=document.createElement('div');d.className='team';d.innerHTML='<b>팀 '+(z+1)+'</b><br>'+teams[z].join(' · ');r.appendChild(d);z++;setTimeout(reveal,420)}else{busy=false;btn.disabled=false}}setTimeout(reveal,450)}}roll()}</script></body></html>
