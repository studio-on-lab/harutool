<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>퍼센트 계산기 | 몇 퍼센트인지 바로 계산 - 하루툴</title><meta name="description" content="전체 중 일부가 몇 퍼센트인지, 비율을 빠르게 계산하는 무료 퍼센트 계산기입니다."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/percentage/"><style>body{font-family:system-ui,'Noto Sans KR',sans-serif;background:#f6f7f9;margin:0;color:#17191d}.w{max-width:720px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;margin:20px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;font:inherit}input{border:1px solid #ddd}button{border:0;background:#111827;color:#fff;font-weight:800;margin-top:10px}.result{font-size:28px;font-weight:900;text-align:center;padding:22px;background:#f8fafc;border-radius:14px;margin-top:12px}a{color:#334155}p{line-height:1.7;color:#64748b}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>％ 퍼센트 계산기</h1><p>일부 값이 전체 값의 몇 퍼센트인지 계산합니다.</p><div class="card"><div class="row"><input id="p" type="number" placeholder="일부 값"><input id="w" type="number" placeholder="전체 값"></div><button onclick="go()">계산하기</button><div id="r" class="result">예: 25 ÷ 200 = 12.5%</div></div><div class="card"><h2>계산식</h2><p>퍼센트 = 일부 값 ÷ 전체 값 × 100 입니다.</p></div></main><script>function go(){const a=+p.value,b=+w.value;if(!Number.isFinite(a)||!Number.isFinite(b)||b===0){r.textContent='값을 확인하세요';return}r.textContent=(a/b*100).toLocaleString(undefined,{maximumFractionDigits:4})+'%'}</script></body></html>
