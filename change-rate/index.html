<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>증감률 계산기 | 증가율·감소율 계산 - 하루툴</title><meta name="description" content="이전 값과 현재 값을 입력하면 증가율 또는 감소율을 자동 계산합니다. 퍼센트 변화율을 빠르게 확인하세요."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/change-rate/"><style>body{font-family:system-ui,'Noto Sans KR',sans-serif;background:#f6f7f9;margin:0;color:#17191d}.w{max-width:720px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;margin:20px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ddd;border-radius:12px;font:inherit}button{width:100%;padding:14px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:800;margin-top:12px}.result{text-align:center;font-size:30px;font-weight:900;padding:24px;background:#f8fafc;border-radius:14px;margin-top:12px}a{color:#334155}p{line-height:1.7;color:#64748b}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>🧮 증감률 계산기</h1><p>이전 값과 현재 값을 입력하면 얼마나 증가하거나 감소했는지 퍼센트로 계산합니다.</p><section class="card"><div class="row"><input id="oldv" type="number" placeholder="이전 값"><input id="newv" type="number" placeholder="현재 값"></div><button onclick="calc()">증감률 계산</button><div class="result" id="r">-</div></section><section class="card"><h2>계산식</h2><p>증감률 = (현재 값 - 이전 값) ÷ 이전 값 × 100입니다. 이전 값이 0이면 일반적인 증감률 계산이 불가능합니다.</p></section></main><script>function calc(){const o=+oldv.value,n=+newv.value;if(!Number.isFinite(o)||!Number.isFinite(n)||o===0){r.textContent='값을 확인하세요';return}const x=(n-o)/Math.abs(o)*100;r.textContent=(x>=0?'증가 ':'감소 ')+Math.abs(x).toFixed(2)+'%';}</script></body></html>
