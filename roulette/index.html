<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>무료 룰렛 돌리기 | 랜덤 선택기 - 하루툴</title><meta name="description" content="점심 메뉴, 발표 순서, 벌칙, 이름 뽑기에 쓰는 무료 온라인 룰렛·랜덤 선택기."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/roulette/"><style>*{box-sizing:border-box}body{font-family:system-ui,'Noto Sans KR',sans-serif;background:linear-gradient(160deg,#f7f8ff,#f5f7fa);color:#17191d;margin:0}.w{max-width:720px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:22px;margin:20px 0;box-shadow:0 10px 30px #1111}textarea{width:100%;padding:14px;border:1px solid #ddd;border-radius:14px;font:inherit;resize:vertical}.stage{position:relative;height:230px;margin:16px 0;display:grid;place-items:center;overflow:hidden;border-radius:22px;background:#111827;color:white}.wheel{width:175px;height:175px;border-radius:50%;background:conic-gradient(#ff6b6b 0 60deg,#ffd43b 60deg 120deg,#69db7c 120deg 180deg,#4dabf7 180deg 240deg,#9775fa 240deg 300deg,#f783ac 300deg);border:8px solid white;box-shadow:0 0 0 5px #ffffff22,0 15px 35px #0005;transition:transform 3.6s cubic-bezier(.12,.72,.13,1)}.pointer{position:absolute;top:17px;font-size:36px;z-index:2}.spin{transform:rotate(1800deg)}button{width:100%;padding:15px;border:0;border-radius:14px;background:#111827;color:#fff;font-weight:900;font-size:17px}.result{text-align:center;min-height:85px;font-size:29px;font-weight:900;padding:23px;background:#eef2ff;border-radius:16px;margin-top:13px;display:grid;place-items:center}.result.pop{animation:pop .45s ease}@keyframes pop{50%{transform:scale(1.08)}}.dots:after{content:'';animation:dots 1s infinite}@keyframes dots{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}a{color:#334155}p{line-height:1.7;color:#64748b}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>🎡 무료 룰렛</h1><p>선택지를 입력하고 돌려보세요. 결과는 마지막 순간에 공개됩니다.</p><section class="card"><textarea id="v" rows="5">짜장면, 짬뽕, 돈까스, 김치찌개</textarea><div class="stage"><div class="pointer">▼</div><div id="wheel" class="wheel"></div></div><button id="btn" onclick="pick()">🎡 룰렛 돌리기</button><div class="result" id="r">과연 결과는?</div></section><section class="card"><h2>같이 해보기</h2><p><a href="../random-number/">랜덤 숫자 뽑기</a> · <a href="../team-picker/">랜덤 팀 나누기</a> · <a href="../lunch-menu/">점심메뉴 추천</a></p></section></main><script>let busy=false,rot=0;function beep(f,d){try{const A=new(window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.frequency.value=f;g.gain.value=.035;o.connect(g);g.connect(A.destination);o.start();setTimeout(()=>{o.stop();A.close()},d)}catch(e){}}function pick(){if(busy)return;const a=v.value.split(/[,\n]/).map(x=>x.trim()).filter(Boolean);if(a.length<2){r.textContent='선택지를 2개 이상 입력하세요';return}busy=true;btn.disabled=true;r.className='result';r.innerHTML='<span class="dots">두구두구</span>';rot+=1440+Math.floor(Math.random()*720);wheel.style.transform='rotate('+rot+'deg)';let ticks=0;const iv=setInterval(()=>{beep(330+ticks*18,45);ticks++},330);setTimeout(()=>{clearInterval(iv);r.textContent='3';beep(500,90)},2350);setTimeout(()=>{r.textContent='2';beep(600,90)},2750);setTimeout(()=>{r.textContent='1';beep(720,100)},3150);setTimeout(()=>{const x=a[Math.floor(Math.random()*a.length)];r.textContent='🎉 '+x+'!';r.className='result pop';beep(900,220);busy=false;btn.disabled=false},3650)}</script></body></html>
