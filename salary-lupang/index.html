<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>월급루팡 계산기 | 오늘 지금까지 번 돈 - 하루툴</title><meta name="description" content="연봉과 출퇴근 시간을 입력하면 오늘 출근 후 지금까지 번 금액을 간단히 추정합니다. 직장인용 무료 월급루팡 계산기."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/salary-lupang/"><style>body{font-family:system-ui,'Noto Sans KR',sans-serif;background:#f6f7f9;margin:0;color:#17191d}.w{max-width:760px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;margin:20px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:12px;font:inherit}button{width:100%;padding:14px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:800;margin-top:12px}.result{font-size:28px;font-weight:900;padding:20px;text-align:center;background:#f8fafc;border-radius:14px;margin-top:12px}a{color:#334155}p{line-height:1.7;color:#64748b}.note{font-size:12px;color:#94a3b8}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>💸 월급루팡 계산기</h1><p>연봉, 출근시간, 퇴근시간, 휴게시간을 기준으로 오늘 지금까지 번 금액을 단순 추정합니다.</p><section class="card"><label>연봉(세전, 원)</label><input id="annual" type="number" value="45000000"><div class="row" style="margin-top:10px"><div><label>출근시간</label><input id="start" type="time" value="09:00"></div><div><label>퇴근시간</label><input id="end" type="time" value="18:00"></div></div><label style="display:block;margin-top:10px">휴게시간(분)</label><input id="breakm" type="number" value="60"><button onclick="calc()">지금까지 번 돈 계산</button><div class="result" id="r">-</div><p class="note">연 260근무일을 기준으로 한 단순 세전 추정치입니다. 실제 급여·세금과 다를 수 있습니다.</p></section><section class="card"><h2>계산 기준</h2><p>연봉을 연 260근무일로 나누고, 입력한 하루 실제 근무시간을 기준으로 시간당 금액을 계산합니다. 오늘 출근 이후 경과한 근무시간에 비례해 금액을 표시합니다.</p></section></main><script>function mins(v){let [h,m]=v.split(':').map(Number);return h*60+m}function calc(){const a=+annual.value,s=mins(start.value),e=mins(end.value),b=+breakm.value||0;let now=new Date(),n=now.getHours()*60+now.getMinutes();let work=Math.max(1,e-s-b),elapsed=Math.max(0,Math.min(n,e)-s);if(n>=(s+b/2))elapsed=Math.max(0,elapsed-Math.min(b,elapsed));let daily=a/260,earned=daily*Math.min(1,elapsed/work);r.textContent=Math.round(earned).toLocaleString('ko-KR')+'원';}calc();</script></body></html>
