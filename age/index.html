<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>만 나이 계산기 | 생년월일 나이 계산 - 하루툴</title><meta name="description" content="생년월일을 입력하면 오늘 기준 만 나이를 바로 계산합니다."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/age/"><style>body{font-family:system-ui,sans-serif;background:#f6f7f9;margin:0;color:#17191d}.w{max-width:720px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;margin:20px 0}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;font:inherit;margin-top:10px}input{border:1px solid #ddd}button{border:0;background:#111827;color:#fff;font-weight:800}.r{padding:25px;text-align:center;background:#eff6ff;border-radius:14px;margin-top:14px;font-size:26px;font-weight:900}a{color:#334155}p{line-height:1.7;color:#64748b}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>🎂 만 나이 계산기</h1><p>생년월일을 입력하면 오늘 날짜를 기준으로 만 나이를 계산합니다.</p><section class="card"><input id="birth" type="date"><button onclick="go()">나이 계산</button><div id="r" class="r">생년월일을 입력하세요</div></section><section class="card"><h2>계산 방식</h2><p>현재 연도에서 출생 연도를 뺀 뒤, 올해 생일이 아직 지나지 않았다면 1을 뺍니다.</p><p><a href="../dday/">D-Day 계산기</a></p></section></main><script>function go(){if(!birth.value){r.textContent='생년월일을 입력하세요';return}const b=new Date(birth.value+'T00:00:00'),t=new Date();if(b>t){r.textContent='미래 날짜는 계산할 수 없습니다';return}let a=t.getFullYear()-b.getFullYear();if(t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate()))a--;r.textContent='만 '+a+'세'}</script></body></html>
