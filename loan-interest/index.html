<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>대출 이자 계산기 | 월 이자·총 이자 계산 - 하루툴</title><meta name="description" content="대출금액, 연이율, 기간을 입력해 단순 월 이자와 기간 총 이자를 빠르게 계산하세요."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/loan-interest/"><style>body{font-family:system-ui,sans-serif;background:#f6f7f9;margin:0;color:#17191d}.w{max-width:720px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;margin:20px 0}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;font:inherit;margin-top:8px}input{border:1px solid #ddd}button{border:0;background:#111827;color:#fff;font-weight:800;margin-top:15px}.result{padding:22px;background:#eff6ff;border-radius:14px;margin-top:14px;font-size:21px;font-weight:800;line-height:1.8}a{color:#334155}p{line-height:1.7;color:#64748b}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>🏦 대출 이자 계산기</h1><p>대출 원금과 연이율, 기간을 기준으로 단순 이자를 빠르게 확인합니다.</p><section class="card"><label>대출금액(원)</label><input id="money" type="number" value="100000000"><label>연이율(%)</label><input id="rate" type="number" step="0.01" value="4"><label>기간(개월)</label><input id="months" type="number" value="12"><button onclick="go()">이자 계산</button><div id="r" class="result">계산 결과</div></section><section class="card"><h2>참고</h2><p>이 계산기는 원금에 연이율을 적용한 단순 이자 참고값입니다. 실제 대출은 원리금균등·원금균등·만기일시상환, 일수 계산, 수수료 등에 따라 달라질 수 있습니다.</p><p><a href="../percentage/">퍼센트 계산기</a> · <a href="../change-rate/">증감률 계산기</a></p></section></main><script>function go(){const m=+money.value,q=+rate.value,n=+months.value;if(m<0||q<0||n<=0){r.textContent='값을 확인하세요';return}const month=m*(q/100)/12,total=month*n;r.innerHTML='월 단순 이자 약 '+Math.round(month).toLocaleString()+'원<br>기간 총 이자 약 '+Math.round(total).toLocaleString()+'원'}</script></body></html>
