<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D-Day 계산기 | 날짜까지 며칠 남았는지 계산 - 하루툴</title><meta name="description" content="시험, 기념일, 마감일까지 남은 날짜를 간단히 계산하는 무료 D-Day 계산기입니다."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/dday/"><style>body{font-family:system-ui,'Noto Sans KR',sans-serif;background:#f6f7f9;margin:0;color:#17191d}.w{max-width:720px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;margin:20px 0}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;font:inherit}input{border:1px solid #ddd}button{border:0;background:#111827;color:#fff;font-weight:800;margin-top:10px}.result{font-size:28px;font-weight:900;text-align:center;padding:22px;background:#f8fafc;border-radius:14px;margin-top:12px}a{color:#334155}p{line-height:1.7;color:#64748b}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>📅 D-Day 계산기</h1><p>목표 날짜를 선택하면 오늘을 기준으로 며칠 남았는지 계산합니다.</p><div class="card"><input id="d" type="date"><button onclick="go()">계산하기</button><div id="r" class="result">날짜를 선택하세요</div></div><div class="card"><h2>언제 쓰나요?</h2><p>시험일, 여행, 기념일, 프로젝트 마감일처럼 특정 날짜까지 남은 기간을 확인할 때 사용할 수 있습니다.</p></div></main><script>function go(){if(!d.value){r.textContent='날짜를 선택하세요';return}const t=new Date(d.value+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);const x=Math.round((t-n)/86400000);r.textContent=x===0?'D-Day':x>0?'D-'+x:'D+'+Math.abs(x)}</script></body></html>
