<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>반응속도 테스트 | 내 반응속도 몇 ms? - 하루툴</title><meta name="description" content="무료 온라인 반응속도 테스트. 화면이 바뀌는 순간 눌러 내 반응속도를 밀리초(ms)로 측정하세요."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/reaction-test/"><style>*{box-sizing:border-box}body{font-family:system-ui,'Noto Sans KR',sans-serif;background:linear-gradient(160deg,#f7f9ff,#f6f7f9);margin:0;color:#17191d}.w{max-width:720px;margin:auto;padding:24px}.box{height:320px;border-radius:24px;background:#e5e7eb;display:flex;align-items:center;justify-content:center;text-align:center;font-size:28px;font-weight:900;padding:24px;cursor:pointer;margin:24px 0;transition:.15s;box-shadow:0 12px 30px #1111}.wait{background:#fee2e2;color:#991b1b}.go{background:#dcfce7;color:#166534;transform:scale(1.015)}.result{background:#eef2ff;color:#312e81}.flash{animation:flash .14s infinite alternate}@keyframes flash{to{filter:brightness(1.06)}}.pop{animation:pop .45s ease}@keyframes pop{50%{transform:scale(1.06)}}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:20px}a{color:#334155}p{line-height:1.7;color:#64748b}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>⚡ 반응속도 테스트</h1><p>시작 후 문구가 바뀌어도 참으세요. 초록색으로 바뀌는 순간 눌러야 합니다.</p><div id="b" class="box">눌러서 시작</div><section class="card"><h2>다른 게임</h2><p><a href="../roulette/">룰렛</a> · <a href="../random-number/">랜덤 숫자</a> · <a href="../lunch-menu/">점심메뉴 추천</a></p></section></main><script>let state=0,t=0,timer,msgTimer;const b=document.getElementById('b'),msgs=['집중…','아직입니다','조금만 더…','속지 마세요','준비…'];function revealScore(ms){let i=0;b.className='box result flash';const iv=setInterval(()=>{b.textContent=(120+Math.floor(Math.random()*380))+' ms';i++;if(i>9){clearInterval(iv);b.className='box result pop';let grade=ms<180?'🔥 번개급':ms<230?'⚡ 매우 빠름':ms<300?'👍 빠른 편':ms<400?'🙂 보통':'🐢 천천히';b.innerHTML=grade+'<br>'+ms+' ms<br><span style="font-size:15px;font-weight:700">눌러서 다시 테스트</span>';state=0}},70)}b.onclick=()=>{if(state===0){state=1;b.className='box wait';let mi=0;b.textContent=msgs[0];msgTimer=setInterval(()=>{b.textContent=msgs[++mi%msgs.length]},420);timer=setTimeout(()=>{clearInterval(msgTimer);state=2;t=performance.now();b.className='box go';b.textContent='지금!';},1500+Math.random()*3200)}else if(state===1){clearTimeout(timer);clearInterval(msgTimer);state=0;b.className='box';b.innerHTML='너무 빨랐어요!<br><span style="font-size:15px">눌러서 다시 시작</span>'}else if(state===2){const ms=Math.round(performance.now()-t);state=3;revealScore(ms)}};</script></body></html>
