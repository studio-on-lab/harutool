<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>무료 룰렛 돌리기 | 랜덤 선택기 - 하루툴</title><meta name="description" content="점심 메뉴, 발표 순서, 벌칙, 이름 뽑기에 쓰는 무료 온라인 룰렛·랜덤 선택기. 설치 없이 바로 사용하세요."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/roulette/"><style>body{font-family:system-ui,'Noto Sans KR',sans-serif;background:#f6f7f9;color:#17191d;margin:0}.w{max-width:720px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;margin:20px 0}textarea{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ddd;border-radius:12px;font:inherit}button{width:100%;padding:14px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:800;font-size:16px;margin-top:10px}.result{text-align:center;font-size:32px;font-weight:900;padding:28px;background:#eef2ff;border-radius:16px;margin-top:12px}a{color:#334155}p{line-height:1.7;color:#64748b}h1{letter-spacing:-1px}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>🎡 무료 룰렛 / 랜덤 선택기</h1><p>선택지를 쉼표 또는 줄바꿈으로 입력하고 버튼을 누르면 무작위로 하나를 골라줍니다. 점심 메뉴, 발표 순서, 벌칙, 당번 정하기 등에 사용할 수 있습니다.</p><section class="card"><textarea id="v" rows="7">짜장면, 짬뽕, 돈까스, 김치찌개</textarea><button onclick="pick()">룰렛 돌리기</button><div class="result" id="r">?</div></section><section class="card"><h2>사용 방법</h2><p>후보를 2개 이상 입력한 뒤 룰렛 돌리기를 누르세요. 입력 내용은 서버로 전송하지 않고 현재 브라우저에서만 처리됩니다.</p></section></main><script>function pick(){const a=document.getElementById('v').value.split(/[,\n]/).map(x=>x.trim()).filter(Boolean);document.getElementById('r').textContent=a.length?a[Math.floor(Math.random()*a.length)]:'선택지를 입력하세요';}</script></body></html>
