<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>평수 계산기 | 평 ↔ 제곱미터(㎡) 변환 - 하루툴</title><meta name="description" content="평을 제곱미터(㎡)로, 제곱미터를 평으로 빠르게 변환하는 무료 평수 계산기입니다."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/area-pyeong/"><style>body{font-family:system-ui,sans-serif;background:#f6f7f9;margin:0;color:#17191d}.w{max-width:720px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;margin:20px 0}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;font:inherit;margin-top:8px}input{border:1px solid #ddd}button{border:0;background:#111827;color:#fff;font-weight:800}.result{padding:20px;background:#f8fafc;border-radius:14px;margin:12px 0;font-size:21px;font-weight:800}a{color:#334155}p{line-height:1.7;color:#64748b}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>🏠 평수 계산기</h1><p>평과 제곱미터(㎡)를 양방향으로 간단히 변환합니다.</p><section class="card"><label>평 → ㎡</label><input id="p" type="number" step="0.01" value="30"><button onclick="p2m()">제곱미터로 변환</button><div id="r1" class="result">-</div><label>㎡ → 평</label><input id="m" type="number" step="0.01" value="84"><button onclick="m2p()">평으로 변환</button><div id="r2" class="result">-</div></section><section class="card"><h2>변환 기준</h2><p>1평은 약 3.305785㎡를 기준으로 계산합니다. 표시 결과는 보기 편하도록 소수 둘째 자리까지 반올림합니다.</p></section></main><script>const K=3.305785;function p2m(){r1.textContent=(+p.value*K).toFixed(2)+' ㎡'}function m2p(){r2.textContent=(+m.value/K).toFixed(2)+' 평'}p2m();m2p()</script></body></html>
