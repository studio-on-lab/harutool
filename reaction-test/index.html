<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>반응속도 테스트 | 내 반응속도 몇 ms? - 하루툴</title><meta name="description" content="무료 온라인 반응속도 테스트. 화면이 초록색으로 바뀌는 순간 눌러 내 반응속도를 밀리초(ms)로 측정하세요."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/reaction-test/"><style>body{font-family:system-ui,'Noto Sans KR',sans-serif;background:#f6f7f9;margin:0;color:#17191d}.w{max-width:720px;margin:auto;padding:24px}.box{height:300px;border-radius:22px;background:#e5e7eb;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:900;padding:20px;box-sizing:border-box;cursor:pointer;margin:24px 0}.wait{background:#fee2e2;color:#991b1b}.go{background:#dcfce7;color:#166534}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:20px}a{color:#334155}p{line-height:1.7;color:#64748b}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>⚡ 반응속도 테스트</h1><p>테스트 영역을 누르면 시작합니다. 화면이 초록색으로 바뀌는 순간 최대한 빠르게 누르세요.</p><div id="b" class="box">눌러서 시작</div><section class="card"><h2>반응속도 측정 방법</h2><p>시작 후 잠시 기다리면 화면 색이 바뀝니다. 너무 일찍 누르면 다시 시작해야 합니다. 결과는 밀리초(ms) 단위로 표시됩니다.</p></section></main><script>let state=0,t=0,timer;const b=document.getElementById('b');b.onclick=()=>{if(state===0){state=1;b.className='box wait';b.textContent='기다리세요…';timer=setTimeout(()=>{state=2;t=performance.now();b.className='box go';b.textContent='지금 누르세요!';},1200+Math.random()*3000)}else if(state===1){clearTimeout(timer);state=0;b.className='box';b.textContent='너무 빨랐어요! 다시 눌러 시작'}else{const ms=Math.round(performance.now()-t);state=0;b.className='box';b.textContent='반응속도 '+ms+' ms — 눌러서 다시 테스트';}};</script></body></html>
