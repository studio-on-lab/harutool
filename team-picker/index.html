<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>랜덤 팀 나누기 | 조 편성·팀 배정 - 하루툴</title><meta name="description" content="이름 목록을 입력하면 무작위로 팀을 나눠주는 무료 랜덤 팀 나누기 도구입니다."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/team-picker/"><style>body{font-family:system-ui,'Noto Sans KR',sans-serif;background:#f6f7f9;margin:0;color:#17191d}.w{max-width:720px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;margin:20px 0}textarea,input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;font:inherit}textarea,input{border:1px solid #ddd}button{border:0;background:#111827;color:#fff;font-weight:800;margin-top:10px}.result{padding:18px;background:#f8fafc;border-radius:14px;margin-top:12px;line-height:1.8}a{color:#334155}p{line-height:1.7;color:#64748b}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>👥 랜덤 팀 나누기</h1><p>참가자 이름과 팀 수를 입력하면 무작위로 섞어 팀을 나눕니다.</p><div class="card"><textarea id="n" rows="7" placeholder="민수, 지영, 철수, 수빈"></textarea><input id="c" type="number" min="2" value="2" style="margin-top:10px"><button onclick="go()">팀 나누기</button><div id="r" class="result">결과가 여기에 표시됩니다.</div></div><div class="card"><h2>활용 예시</h2><p>수업 조 편성, 게임 팀 배정, 회식 자리 나누기, 발표 조 구성 등에 사용할 수 있습니다.</p></div></main><script>function go(){const a=n.value.split(/[,\n]/).map(x=>x.trim()).filter(Boolean);const k=+c.value;if(a.length<2||k<2||k>a.length){r.textContent='이름과 팀 수를 확인하세요';return}for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}const t=Array.from({length:k},()=>[]);a.forEach((x,i)=>t[i%k].push(x));r.innerHTML=t.map((x,i)=>'<b>팀 '+(i+1)+'</b>: '+x.join(', ')).join('<br>')}</script></body></html>
