<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시급 계산기 | 근무시간 급여 계산 - 하루툴</title><meta name="description" content="시급과 근무시간, 근무일수를 입력해 예상 급여를 간단하게 계산합니다."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/hourly-wage/"><style>body{font-family:system-ui,sans-serif;background:#f6f7f9;margin:0;color:#17191d}.w{max-width:720px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;margin:20px 0}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;font:inherit;margin-top:8px}input{border:1px solid #ddd}button{border:0;background:#111827;color:white;font-weight:800;margin-top:15px}.result{padding:24px;background:#f0fdf4;border-radius:14px;margin-top:14px;text-align:center;font-size:23px;font-weight:900}a{color:#334155}p{line-height:1.7;color:#64748b}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>⏱️ 시급 계산기</h1><p>시급과 하루 근무시간, 근무일수를 입력하면 단순 예상 급여를 계산합니다.</p><section class="card"><label>시급(원)</label><input id="wage" type="number" value="10000"><label>하루 근무시간</label><input id="hours" type="number" step="0.5" value="8"><label>근무일수</label><input id="days" type="number" value="20"><button onclick="go()">급여 계산</button><div id="r" class="result">예상 급여</div></section><section class="card"><h2>계산 기준</h2><p>시급 × 하루 근무시간 × 근무일수의 단순 계산입니다. 주휴수당, 연장·야간·휴일수당, 세금 등은 포함하지 않습니다.</p><p><a href="../salary-lupang/">월급루팡 계산기</a> · <a href="../percentage/">퍼센트 계산기</a></p></section></main><script>function go(){const a=+wage.value,b=+hours.value,c=+days.value;if(a<0||b<0||c<0){r.textContent='값을 확인하세요';return}r.textContent='예상 급여 '+Math.round(a*b*c).toLocaleString()+'원'}</script></body></html>
