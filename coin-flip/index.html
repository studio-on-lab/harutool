<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>동전 던지기 | 앞면 뒷면 랜덤 결정 - 하루툴</title><meta name="description" content="온라인 동전을 던져 앞면 또는 뒷면을 랜덤으로 결정하세요. 결과 전 회전 애니메이션으로 재미있게 확인할 수 있습니다."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/coin-flip/"><style>body{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;background:#f6f7f9;margin:0;color:#17191d}.w{max-width:720px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:22px;margin:20px 0;text-align:center}.stage{height:250px;display:grid;place-items:center;perspective:900px}.coin{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;font-size:62px;font-weight:900;background:radial-gradient(circle at 35% 30%,#fff7bf,#f0b429 65%,#c98700);border:8px solid #d49a13;box-shadow:0 18px 35px #0002;transform-style:preserve-3d}.flip{animation:flip 2.6s cubic-bezier(.15,.7,.18,1)}@keyframes flip{0%{transform:rotateY(0) translateY(0)}40%{transform:rotateY(1260deg) translateY(-45px)}100%{transform:rotateY(2520deg) translateY(0)}}button{width:100%;padding:15px;border:0;border-radius:13px;background:#111827;color:#fff;font-weight:900;font-size:17px}.result{font-size:30px;font-weight:900;min-height:58px;margin-top:14px}.pop{animation:pop .35s ease}@keyframes pop{50%{transform:scale(1.12)}}a{color:#334155}p{color:#64748b;line-height:1.7}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>🪙 동전 던지기</h1><p>둘 중 하나만 정하면 될 때. 동전을 던지고 마지막에 딱 멈춘 결과를 확인하세요.</p><section class="card"><div class="stage"><div id="coin" class="coin">?</div></div><button id="btn" onclick="go()">동전 던지기</button><div id="r" class="result">앞면일까, 뒷면일까?</div></section><section class="card"><h2>같이 해보기</h2><p><a href="../roulette/">룰렛</a> · <a href="../random-number/">랜덤 숫자</a> · <a href="../all-tools/">전체 도구</a></p></section></main><script>let busy=false;function go(){if(busy)return;busy=true;btn.disabled=true;r.className='result';r.textContent='휘리릭…';coin.classList.remove('flip');void coin.offsetWidth;coin.classList.add('flip');let i=0,iv=setInterval(()=>{coin.textContent=i++%2?'앞':'뒤'},110);setTimeout(()=>{clearInterval(iv);r.textContent='과연…'},2050);setTimeout(()=>{const x=Math.random()<.5?'앞면':'뒷면';coin.textContent=x==='앞면'?'앞':'뒤';r.textContent='🪙 '+x+'!';r.className='result pop';busy=false;btn.disabled=false},2650)}</script></body></html>
