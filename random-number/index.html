<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>랜덤 숫자 뽑기 | 중복 없는 번호 추첨 - 하루툴</title><meta name="description" content="원하는 최소값과 최대값 사이에서 중복 없이 랜덤 숫자를 무료로 뽑으세요."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/random-number/"><style>*{box-sizing:border-box}body{font-family:system-ui,'Noto Sans KR',sans-serif;background:linear-gradient(160deg,#f7fbff,#f6f7f9);margin:0;color:#17191d}.w{max-width:720px;margin:auto;padding:24px}.card{background:white;border:1px solid #e5e7eb;border-radius:24px;padding:22px;margin:20px 0;box-shadow:0 10px 30px #1111}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font:inherit}button{width:100%;padding:15px;border:0;border-radius:14px;background:#111827;color:white;font-weight:900;font-size:17px;margin-top:12px}.result{min-height:120px;display:grid;place-items:center;text-align:center;background:#eef6ff;border-radius:18px;margin-top:14px;padding:22px;font-size:30px;font-weight:900;letter-spacing:2px}.rolling{animation:blur .12s infinite alternate}@keyframes blur{to{filter:blur(1.5px);transform:scale(.98)}}.pop{animation:pop .45s ease}@keyframes pop{50%{transform:scale(1.08)}}a{color:#334155}p{line-height:1.7;color:#64748b}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>🎲 랜덤 숫자 뽑기</h1><p>숫자들이 휘리릭 바뀌다가 마지막에 선택된 번호가 딱 멈춥니다.</p><div class="card"><div class="row"><input id="min" type="number" value="1"><input id="max" type="number" value="45"></div><input id="cnt" type="number" value="6" min="1" style="margin-top:10px"><button id="btn" onclick="go()">🎯 숫자 추첨 시작</button><div class="result" id="r">과연 어떤 숫자가?</div></div><div class="card"><h2>다른 랜덤 도구</h2><p><a href="../roulette/">룰렛</a> · <a href="../team-picker/">팀 나누기</a> · <a href="../lunch-menu/">점심메뉴 추천</a></p></div></main><script>let busy=false;function sample(a,b,n){const p=[];for(let i=a;i<=b;i++)p.push(i);for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}return p.slice(0,n).sort((x,y)=>x-y)}function go(){if(busy)return;let a=+min.value,b=+max.value,n=+cnt.value;if(a>b)[a,b]=[b,a];if(n<1||n>b-a+1){r.textContent='개수를 확인하세요';return}busy=true;btn.disabled=true;r.className='result rolling';let i=0,delay=55;function roll(){r.textContent=sample(a,b,n).join(' · ');i++;if(i>15)delay+=28;else delay+=5;if(i<24)setTimeout(roll,delay);else{const final=sample(a,b,n);r.textContent='마지막 추첨 중…';setTimeout(()=>{r.textContent=final.join(' · ');r.className='result pop';busy=false;btn.disabled=false},650)}}roll()}</script></body></html>
