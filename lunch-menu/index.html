<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>점심메뉴 추천 | 오늘 뭐 먹지? 랜덤 추천 - 하루툴</title><meta name="description" content="오늘 점심 뭐 먹을지 고민될 때 버튼 한 번으로 메뉴를 랜덤 추천합니다."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/lunch-menu/"><style>*{box-sizing:border-box}body{font-family:system-ui,'Noto Sans KR',sans-serif;background:linear-gradient(160deg,#fff9f2,#f6f7f9);margin:0;color:#17191d}.w{max-width:720px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:22px;margin:20px 0;box-shadow:0 10px 30px #1111}button{width:100%;padding:16px;border:0;border-radius:14px;background:#111827;color:#fff;font-weight:900;font-size:17px}.result{text-align:center;font-size:34px;font-weight:900;padding:38px 18px;background:#fff7ed;border-radius:18px;margin-top:14px;min-height:125px;display:grid;place-items:center}.shake{animation:shake .12s infinite}@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}.pop{animation:pop .5s ease}@keyframes pop{50%{transform:scale(1.1)}}.sub{text-align:center;font-size:14px;color:#9a6b3b}a{color:#334155}p{line-height:1.7;color:#64748b}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>🍱 오늘 점심 뭐 먹지?</h1><p>버튼을 누르면 후보들이 빠르게 지나가다가 오늘의 메뉴가 결정됩니다.</p><section class="card"><button id="b" onclick="go()">🔥 오늘 점심 운명 결정하기</button><div class="result" id="r">오늘의 선택은…?</div><div class="sub">마음에 안 들면 한 번만 더 😏</div></section><section class="card"><h2>다른 랜덤 도구</h2><p><a href="../roulette/">룰렛 돌리기</a> · <a href="../random-number/">랜덤 숫자 뽑기</a> · <a href="../team-picker/">랜덤 팀 나누기</a></p></section></main><script>const m=['김치찌개','된장찌개','제육볶음','돈까스','비빔밥','국밥','냉면','칼국수','짜장면','짬뽕','마라탕','볶음밥','초밥','회덮밥','라멘','우동','김밥','떡볶이','순대','샌드위치','햄버거','쌀국수','카레','닭갈비'];let busy=false;function go(){if(busy)return;busy=true;b.disabled=true;r.className='result shake';let i=0,delay=70;function roll(){r.textContent=m[Math.floor(Math.random()*m.length)];i++;delay+=i>12?28:7;if(i<20)setTimeout(roll,delay);else{r.textContent='🥁 마지막 선택…';setTimeout(()=>{r.textContent='🍽️ '+m[Math.floor(Math.random()*m.length)];r.className='result pop';busy=false;b.disabled=false},800)}}roll()}</script></body></html>
