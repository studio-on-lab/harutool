<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>무료 룰렛 돌리기 | 랜덤 선택기 - 하루툴</title><meta name="description" content="점심 메뉴, 발표 순서, 벌칙, 이름 뽑기에 쓰는 무료 온라인 룰렛·랜덤 선택기."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/roulette/"><style>*{box-sizing:border-box}body{font-family:system-ui,'Noto Sans KR',sans-serif;background:linear-gradient(160deg,#f7f8ff,#f5f7fa);color:#17191d;margin:0}.w{max-width:720px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:22px;margin:20px 0;box-shadow:0 10px 30px #1111}textarea{width:100%;padding:14px;border:1px solid #ddd;border-radius:14px;font:inherit;resize:vertical}.stage{height:230px;margin:16px 0;display:grid;place-items:center;overflow:hidden;border-radius:22px;background:#111827;color:white;position:relative}.slot{font-size:42px;font-weight:1000;letter-spacing:-1px;text-align:center;padding:20px;transform:translateZ(0)}.slot.flash{animation:flash .12s linear infinite}@keyframes flash{50%{opacity:.45;transform:scale(.97)}}.slot.hit{animation:hit .45s ease}@keyframes hit{0%{transform:scale(.7);opacity:.2}65%{transform:scale(1.16)}100%{transform:scale(1);opacity:1}}.hint{position:absolute;bottom:14px;font-size:13px;color:#94a3b8}button{width:100%;padding:15px;border:0;border-radius:14px;background:#111827;color:#fff;font-weight:900;font-size:17px}.result{text-align:center;min-height:70px;font-size:18px;font-weight:800;padding:18px;background:#eef2ff;border-radius:16px;margin-top:13px;display:grid;place-items:center}a{color:#334155}p{line-height:1.7;color:#64748b}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>🎰 랜덤 선택기</h1><p>버튼을 누르면 후보들이 빠르게 휘리릭 지나가다가 점점 느려지고, 마지막 하나에서 딱 멈춥니다.</p><section class="card"><textarea id="v" rows="5">짜장면, 짬뽕, 돈까스, 김치찌개</textarea><div class="stage"><div id="slot" class="slot">READY</div><div class="hint">마지막에 딱 멈춥니다</div></div><button id="btn" onclick="pick()">🔥 돌리기</button><div class="result" id="r">결과를 기다려보세요</div></section><section class="card"><h2>같이 해보기</h2><p><a href="../random-number/">랜덤 숫자 뽑기</a> · <a href="../team-picker/">랜덤 팀 나누기</a> · <a href="../lunch-menu/">점심메뉴 추천</a></p></section></main><script>let busy=false;function beep(f,d=.04){try{const A=new(window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.frequency.value=f;g.gain.value=.025;o.connect(g);g.connect(A.destination);o.start();setTimeout(()=>{o.stop();A.close()},d*1000)}catch(e){}}function pick(){if(busy)return;const a=v.value.split(/[,\n]/).map(x=>x.trim()).filter(Boolean);if(a.length<2){slot.textContent='2개 이상 입력';return}busy=true;btn.disabled=true;r.textContent='후보 선택 중…';slot.className='slot flash';let count=0,delay=55,last='';function roll(){let x=a[Math.floor(Math.random()*a.length)];if(a.length>1&&x===last)x=a[(a.indexOf(x)+1)%a.length];last=x;slot.textContent=x;beep(240+count*7);count++;if(count<18)delay=55;else if(count<25)delay+=22;else if(count<30)delay+=55;if(count<30)setTimeout(roll,delay);else{const final=a[Math.floor(Math.random()*a.length)];setTimeout(()=>{slot.textContent=final;slot.className='slot hit';r.textContent='🎉 최종 선택: '+final;beep(880,.18);busy=false;btn.disabled=false},420)}}roll()}</script></body></html>
