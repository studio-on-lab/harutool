<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>날짜 계산기 | 두 날짜 사이 며칠 계산 - 하루툴</title><meta name="description" content="시작일과 종료일을 입력해 두 날짜 사이의 일수와 주 수를 계산합니다."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/date-difference/"><style>body{font-family:system-ui,sans-serif;background:#f6f7f9;margin:0;color:#17191d}.w{max-width:720px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;margin:20px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;font:inherit}input{border:1px solid #ddd}button{border:0;background:#111827;color:#fff;font-weight:800;margin-top:12px}.r{padding:22px;text-align:center;background:#f8fafc;border-radius:14px;margin-top:14px;font-size:22px;font-weight:900;line-height:1.7}a{color:#334155}p{line-height:1.7;color:#64748b}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>📅 날짜 계산기</h1><p>두 날짜 사이가 정확히 며칠인지 빠르게 계산합니다.</p><section class="card"><div class="row"><input id="a" type="date"><input id="b" type="date"></div><button onclick="go()">날짜 차이 계산</button><div id="r" class="r">날짜를 선택하세요</div></section><section class="card"><h2>활용 예시</h2><p>여행까지 남은 기간, 계약 기간, 프로젝트 기간 등을 확인할 때 사용할 수 있습니다.</p><p><a href="../dday/">D-Day 계산기</a> · <a href="../age/">만 나이 계산기</a></p></section></main><script>function go(){if(!a.value||!b.value){r.textContent='두 날짜를 선택하세요';return}const x=new Date(a.value+'T00:00:00'),y=new Date(b.value+'T00:00:00'),d=Math.abs(Math.round((y-x)/86400000));r.innerHTML=d.toLocaleString()+'일<br><small>약 '+(d/7).toFixed(1)+'주</small>'}</script></body></html>
