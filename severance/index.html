<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>퇴직금 계산기 | 근속기간 예상 퇴직금 - 하루툴</title><meta name="description" content="평균 월급과 근속기간을 입력해 예상 퇴직금을 간단하게 계산합니다."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/severance/"><style>body{font-family:system-ui,sans-serif;background:#f6f7f9;margin:0;color:#17191d}.w{max-width:720px;margin:auto;padding:24px}.card{background:white;border:1px solid #e5e7eb;border-radius:20px;padding:22px;margin:20px 0}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;font:inherit;margin-top:8px}input{border:1px solid #ddd}button{border:0;background:#111827;color:#fff;font-weight:800}.r{padding:24px;text-align:center;background:#eff6ff;border-radius:14px;margin-top:14px;font-size:24px;font-weight:900}.note{font-size:12px;color:#94a3b8}a{color:#334155}p{line-height:1.7;color:#64748b}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>🧳 퇴직금 계산기</h1><p>평균 월급과 근속기간으로 퇴직금 규모를 간단히 추정합니다.</p><section class="card"><label>평균 월급(원)</label><input id="pay" type="number" value="3500000"><label>근속기간(년)</label><input id="years" type="number" step="0.1" value="3"><button onclick="go()">퇴직금 계산</button><div id="r" class="r">예상 퇴직금</div><p class="note">평균 월급 × 근속연수 방식의 단순 참고값입니다. 실제 법정 퇴직금은 평균임금 산정, 계속근로기간 등 개별 조건에 따라 달라질 수 있습니다.</p></section><section class="card"><h2>관련 도구</h2><p><a href="../salary-net/">연봉 실수령액 계산기</a> · <a href="../hourly-wage/">시급 계산기</a></p></section></main><script>function go(){const p=+pay.value,y=+years.value;if(p<0||y<0){r.textContent='입력값을 확인하세요';return}r.textContent='약 '+Math.round(p*y).toLocaleString()+'원'}</script></body></html>
