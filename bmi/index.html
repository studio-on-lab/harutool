<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMI 계산기 | 체질량지수 간단 계산 - 하루툴</title><meta name="description" content="키와 몸무게를 입력해 BMI 체질량지수를 간단히 계산합니다. 일반적인 참고용 계산기입니다."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/bmi/"><style>body{font-family:system-ui,sans-serif;background:#f6f7f9;margin:0;color:#17191d}.w{max-width:720px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;margin:20px 0}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;font:inherit;margin-top:8px}input{border:1px solid #ddd}button{border:0;background:#111827;color:#fff;font-weight:800}.r{padding:24px;text-align:center;background:#f0fdf4;border-radius:14px;margin-top:14px;font-size:25px;font-weight:900}a{color:#334155}p{line-height:1.7;color:#64748b}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>⚖️ BMI 계산기</h1><p>키와 몸무게를 이용해 체질량지수(BMI)를 계산합니다.</p><section class="card"><label>키(cm)</label><input id="h" type="number" value="170"><label>몸무게(kg)</label><input id="w" type="number" step="0.1" value="65"><button onclick="go()">BMI 계산</button><div id="r" class="r">BMI 결과</div></section><section class="card"><h2>BMI란?</h2><p>BMI는 체중(kg)을 키(m)의 제곱으로 나눈 값입니다. 개인의 건강 상태를 진단하는 도구가 아니며 단순 참고용입니다.</p></section></main><script>function go(){const a=+h.value/100,b=+w.value;if(a<=0||b<=0){r.textContent='키와 몸무게를 확인하세요';return}r.textContent='BMI '+(b/(a*a)).toFixed(1)}</script></body></html>
