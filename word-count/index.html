<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>글자수 세기 | 공백 제외·바이트 계산 - 하루툴</title><meta name="description" content="자소서, 문자, 게시물 작성 전에 글자수와 공백 제외 글자수, UTF-8 바이트를 무료로 바로 계산하세요."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/word-count/"><style>body{font-family:system-ui,'Noto Sans KR',sans-serif;background:#f6f7f9;margin:0;color:#17191d}.w{max-width:760px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;margin:20px 0}textarea{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ddd;border-radius:12px;font:inherit;min-height:240px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.stat{padding:18px;background:#f8fafc;border-radius:14px;text-align:center}.n{font-size:28px;font-weight:900}a{color:#334155}p{line-height:1.7;color:#64748b}@media(max-width:600px){.stats{grid-template-columns:1fr}}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>🔢 글자수 세기</h1><p>텍스트를 입력하면 전체 글자수, 공백 제외 글자수, UTF-8 바이트를 실시간으로 계산합니다.</p><section class="card"><textarea id="t" placeholder="여기에 내용을 입력하세요."></textarea><div class="stats"><div class="stat"><div class="n" id="c">0</div><div>전체 글자수</div></div><div class="stat"><div class="n" id="ns">0</div><div>공백 제외</div></div><div class="stat"><div class="n" id="b">0</div><div>UTF-8 bytes</div></div></div></section><section class="card"><h2>어디에 쓰나요?</h2><p>자기소개서, 문자메시지, SNS 게시물, 제목 길이 확인 등 글자수 제한이 있는 문서를 작성할 때 빠르게 확인할 수 있습니다. 입력한 내용은 서버로 전송되지 않습니다.</p></section></main><script>const t=document.getElementById('t');function u(){const v=t.value;c.textContent=[...v].length;ns.textContent=[...v.replace(/\s/g,'')].length;b.textContent=new TextEncoder().encode(v).length}t.addEventListener('input',u);u();</script></body></html>
