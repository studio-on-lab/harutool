<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>연봉 실수령액 계산기 | 월 예상 실수령액 - 하루툴</title><meta name="description" content="세전 연봉을 입력해 월 세전 급여와 공제 후 예상 실수령액을 간단히 확인하세요."><link rel="canonical" href="https://studio-on-lab.github.io/harutool/salary-net/"><style>body{font-family:system-ui,sans-serif;background:#f6f7f9;margin:0;color:#17191d}.w{max-width:720px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;margin:20px 0}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;font:inherit;margin-top:8px}input{border:1px solid #ddd}button{border:0;background:#111827;color:white;font-weight:800}.r{padding:22px;background:#f0fdf4;border-radius:14px;margin-top:14px;font-size:20px;font-weight:800;line-height:1.8}a{color:#334155}p{line-height:1.7;color:#64748b}.note{font-size:12px;color:#94a3b8}</style></head><body><main class="w"><a href="../">← 하루툴 홈</a><h1>💰 연봉 실수령액 계산기</h1><p>세전 연봉에서 예상 공제율을 적용해 월 실수령액을 빠르게 가늠합니다.</p><section class="card"><label>세전 연봉(원)</label><input id="salary" type="number" value="45000000"><label>예상 공제율(%)</label><input id="deduct" type="number" step="0.1" value="12"><button onclick="go()">실수령액 계산</button><div id="r" class="r">계산 결과</div><p class="note">개인별 세금·4대보험·부양가족·비과세 항목 등에 따라 실제 금액은 달라집니다. 정확한 급여명세 계산이 아닌 참고용 추정입니다.</p></section><section class="card"><h2>함께 쓰는 직장인 도구</h2><p><a href="../hourly-wage/">시급 계산기</a> · <a href="../salary-lupang/">월급루팡 계산기</a> · <a href="../severance/">퇴직금 계산기</a></p></section></main><script>function go(){const s=+salary.value,d=+deduct.value;if(s<0||d<0||d>=100){r.textContent='입력값을 확인하세요';return}const gross=s/12,net=gross*(1-d/100);r.innerHTML='월 세전 약 '+Math.round(gross).toLocaleString()+'원<br>월 예상 실수령액 '+Math.round(net).toLocaleString()+'원<br>연 예상 실수령액 '+Math.round(net*12).toLocaleString()+'원'}</script></body></html>
